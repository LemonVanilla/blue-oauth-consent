<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Allow access?</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b1020; color: #e8ecf5; font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  main { width: min(92vw, 420px); background: #141a2e; border: 1px solid #263052; border-radius: 16px; padding: 28px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { margin: 8px 0; color: #b7c0d8; }
  .who { color: #e8ecf5; font-weight: 600; }
  ul { padding-left: 20px; color: #b7c0d8; }
  .row { display: flex; gap: 12px; margin-top: 20px; }
  button { flex: 1; padding: 12px 16px; border-radius: 10px; border: 1px solid #263052; background: #1c2542; color: #e8ecf5; font-size: 16px; cursor: pointer; }
  button.primary { background: #2f6bff; border-color: #2f6bff; }
  button:disabled { opacity: .5; cursor: default; }
  .err { color: #ff8a8a; white-space: pre-wrap; }
  .muted { font-size: 13px; color: #7f8aa8; }
  button.link { flex: none; padding: 0; border: 0; background: none; color: #8fb0ff; font-size: 13px; text-decoration: underline; }
</style>
</head>
<body>
<main id="app"><h1>Allow access?</h1><p id="status">Checking your sign-in…</p></main>
<script type="module">
// Pinned (Rainquail #119): a supabase-js release can't change this page under every connector.
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.117.2';

const SUPABASE_URL = "https://hgfktbhjegakgzqqimbg.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_12YPySCowwHtXPMG8d3eLQ_m0L2UB1_";
const app = document.getElementById('app');
const setStatus = (t) => { document.getElementById('status').textContent = t; };
// Every value from the request (app name, email, scopes) goes in through
// textContent, never innerHTML: dynamic registration lets any client pick its
// own name, so a name could otherwise carry HTML or script onto this page.
const el = (tag, text, cls) => { const n = document.createElement(tag); if (text != null) n.textContent = text; if (cls) n.className = cls; return n; };
const fail = (msg) => { app.replaceChildren(el('h1', 'Allow access?'), el('p', msg, 'err')); };
// Every call the page waits on gets a 20 s deadline, so it can never sit on a status line for good. The calls take no
// signal, so the race only stops the wait; past it the page says so and offers Try again.
const DEADLINE_MS = 20000;
const withDeadline = (p) => new Promise((resolve, reject) => {
  const t = setTimeout(() => reject(Object.assign(new Error('deadline'), { deadline: true })), DEADLINE_MS);
  Promise.resolve(p).then((v) => { clearTimeout(t); resolve(v); }, (e) => { clearTimeout(t); reject(e); });
});
const tooLong = () => {
  const again = el('button', 'Try again', 'primary'); again.id = 'again';
  again.onclick = () => location.reload();
  const row = el('div', null, 'row'); row.append(again);
  app.replaceChildren(el('h1', 'Allow access?'), el('p', 'This is taking too long. Close this tab and connect again from your AI app.', 'err'), row);
};
const failWith = (e) => { if (e && e.deadline) tooLong(); else fail((e && e.message) || String(e)); };
// An already-approved request's redirect is followed only to https, or http on this computer (a local client).
const safeRedirect = (u) => {
  try {
    const x = new URL(String(u));
    if (x.protocol === 'https:') return x.href;
    if (x.protocol === 'http:' && ['localhost', '127.0.0.1', '[::1]'].includes(x.hostname)) return x.href;
  } catch { /* not a URL */ }
  return null;
};

const params = new URLSearchParams(location.search);
const authorizationId = params.get('authorization_id');
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

try {
  if (!authorizationId) {
    fail('This page is only reached from a connector authorization request (missing authorization_id). Nothing to approve.');
  } else {
    // 1. Signed in? If not, go through Google and come straight back here.
    let { data: { session } } = await withDeadline(sb.auth.getSession());
    if (!session) {
      setStatus('Signing you in with Google…');
      const { error } = await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.href, queryParams: { prompt: 'select_account' } } });
      if (error) fail('Sign-in failed: ' + error.message);
    } else {
      // 2. What is being asked?
      setStatus('Loading the request…');
      const { data: details, error } = await withDeadline(sb.auth.oauth.getAuthorizationDetails(authorizationId));
      if (error) throw error;
      // 3. Already allowed? When a consent already covers the request, Supabase approves it on the spot and answers
      // only the AI app's redirect (no client details). Go straight back; replace, so Back doesn't re-run the request.
      if (details?.redirect_url && !details?.client) {
        const to = safeRedirect(details.redirect_url);
        if (to) {
          app.replaceChildren(el('h1', 'Allow access?'), el('p', 'Already allowed. Taking you back to your AI app…'));
          location.replace(to);
        } else {
          fail('This request was already answered. You can close this tab and try connecting again.');
        }
      } else {
        const client = details?.client?.name ?? details?.client_name ?? 'an app';
        const scopes = details?.scopes ?? details?.scope?.split(' ') ?? [];
        const email = session.user.email ?? session.user.id;
        const h1 = el('h1');
        h1.append(el('span', String(client), 'who'), ' wants to use your account');
        const who = el('p', 'Signed in as ');
        who.append(el('span', String(email), 'who'), '.');
        const parts = [h1, who,
          el('p', 'Approving lets this AI app read your data and make the changes you ask it for. You can see everything it did, and sign it out, in the app’s Settings.')];
        if (scopes.length) {
          parts.push(el('p', 'Requested access:'));
          const ul = el('ul');
          for (const sc of scopes) ul.append(el('li', String(sc)));
          parts.push(ul);
        }
        const row = el('div', null, 'row');
        const deny = el('button', 'Deny'); deny.id = 'deny';
        const approve = el('button', 'Approve', 'primary'); approve.id = 'approve';
        row.append(deny, approve);
        const other = el('button', 'Use a different account', 'link'); other.id = 'other';
        const notYou = el('p', 'Not you? ', 'muted'); notYou.append(other);
        parts.push(row, notYou);
        app.replaceChildren(...parts);
        const buttons = [...app.querySelectorAll('button')];
        const go = async (fn) => {
          buttons.forEach(b => b.disabled = true);
          let data, error;
          // skipBrowserRedirect: the page goes to the redirect itself (auth-js answers redirect_url).
          try { ({ data, error } = await withDeadline(fn(authorizationId, { skipBrowserRedirect: true }))); } catch (e) { failWith(e); return; }
          if (error) { buttons.forEach(b => b.disabled = false); fail(error.message); return; }
          const to = data?.redirect_url ?? data?.redirect_to;
          if (to) location.href = to; else fail('Done, but no redirect was returned. You can close this tab.');
        };
        document.getElementById('approve').onclick = () => go((id, o) => sb.auth.oauth.approveAuthorization(id, o));
        document.getElementById('deny').onclick = () => go((id, o) => sb.auth.oauth.denyAuthorization(id, o));
        document.getElementById('other').onclick = async () => {
          app.replaceChildren(el('h1', 'Allow access?'), el('p', 'Signing you in with Google…'));
          await sb.auth.signOut({ scope: 'local' });
          const { error } = await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.href, queryParams: { prompt: 'select_account' } } });
          if (error) fail('Sign-in failed: ' + error.message);
        };
      }
    }
  }
} catch (e) {
  failWith(e);
}
</script>
</body>
</html>
